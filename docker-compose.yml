# Teammate quickstart: install Docker Desktop, then run `docker compose up` from the repo root.
# This starts both the FastAPI backend and Ollama with persistent model storage.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: >
      sh -c "
        ollama serve &
        until ollama list >/dev/null 2>&1; do
          sleep 1;
        done;
        ollama pull llama3;
        ollama pull phi3;
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q 'llama3' && ollama list | grep -q 'phi3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  ollama_data:
